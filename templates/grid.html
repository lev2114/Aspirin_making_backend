<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плитка - Производство аспирина</title>
    <link rel="stylesheet" href="/static/styles/style.css">
    <style>
        .grid-wrapper { padding: 20px 10px 80px 10px; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
        .grid-item { width: 48%; background: #eee; border: 1px solid #ccc; text-align: center; padding-bottom: 5px; }
        .grid-item img { width: 100%; height: 120px; object-fit: cover; }
        .grid-title { font-size: 12px; margin: 5px 0 0 0; }
        .grid-stats { font-size: 12px; color: #555; }
        .filter-form { margin-bottom: 15px; padding: 10px; background: #e0e0e0; border-radius: 5px; text-align: center;}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="grid-wrapper">
            <h2 style="margin-top: 0;">Этапы синтеза</h2>
            
            <form class="filter-form" action="/grid" method="GET" style="background: white; padding: 15px; border-radius: 0;">
                <div style="display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 10px;">
                    <span>Длительность, мин.</span>
                    <span style="font-weight: bold;">{{ .currentDuration }}</span>
                </div>
    
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 14px;">0</span>
                    <input type="range" name="duration" min="0" max="30" value="{{ .currentDuration }}">
                    <span style="font-size: 14px;">30</span>
                </div>
    
                <button type="submit" style="width: 100%; padding: 10px; margin-top: 15px; background: #002366; color: white; border: none; font-weight: bold; font-size: 14px;">ПРИМЕНИТЬ ФИЛЬТР</button>
            </form>

            <div class="grid-container">
                {{ range .stages }}
                <div class="grid-item">
                    <img src="{{ .ImageURL }}" alt="{{ .Title }}">
                    <div class="grid-title">{{ .Title }}</div>
                    <div class="grid-stats">{{ .DurationMin }} мин.<br>❤️ {{ .Likes }}</div>
                </div>
                {{ end }}
            </div>
        </div>
        
        <div class="bottom-nav">
            <a href="/">Лента</a>
            <a href="/add">Добавление</a>
            <a href="/grid">Плитка</a>
        </div>
    </div>
</body>
</html>
