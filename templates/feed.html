<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента - Производство аспирина</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app-container">
        <div class="vibes-card" style="position: relative; overflow: hidden; background-color: #000;">
            <video autoplay loop muted playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;">
                <source src="{{ .stage.VideoURL }}" type="video/mp4">
            </video>

            <div class="overlay-right" style="z-index: 2;">
                <div style="margin-bottom: 20px;">{{ .stage.DurationMin }}<br>МИН.</div>
                <div style="margin-bottom: 20px;">{{ .stage.YieldPct }}%</div>
                <div style="margin-bottom: 20px; text-align: center;">
                        <img src="/static/img/heart.png" alt="Лайки" style="width: 84px; height: 84px; display: block; margin: 0 auto 5px auto;">
                        {{ .stage.Likes }}
                </div>
                <a href="/?id={{ .nextID }}" class="btn-icon">
                    <img src="/static/img/next.png" alt="Далее" style="height: 84px; width: 84px">
                </a>
            </div>

            <div class="overlay-bottom" style="z-index: 2;">
                <h3 style="margin: 0 0 5px 0;">{{ .stage.Title }}</h3>
                <a href="/stage/{{ .stage.ID }}" style="color: lightgray; text-decoration: none; font-size: 14px;">Развернуть</a>
            </div>
        </div>
        
        <div class="bottom-nav" style="z-index: 3;">
            <a href="/">Лента</a>
            <a href="/add">Добавление</a>
            <a href="/grid">Плитка</a>
        </div>
    </div>
</body>
</html>
